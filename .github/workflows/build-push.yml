name: Build and Push

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_ENV: dev

jobs:
  # ─── 1. Detect which service directories changed ───
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      services: ${{ steps.set-matrix.outputs.services }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            config-server:
              - 'spring-petclinic-config-server/**'
            discovery-server:
              - 'spring-petclinic-discovery-server/**'
            api-gateway:
              - 'spring-petclinic-api-gateway/**'
            customers-service:
              - 'spring-petclinic-customers-service/**'
            visits-service:
              - 'spring-petclinic-visits-service/**'
            vets-service:
              - 'spring-petclinic-vets-service/**'
            genai-service:
              - 'spring-petclinic-genai-service/**'
            admin-server:
              - 'spring-petclinic-admin-server/**'

      - name: Build matrix from changed services
        id: set-matrix
        run: |
          ENTRIES=()
          SERVICES=()

          check() {
            local flag="$1" name="$2" module="$3" port="$4"
            if [ "$flag" == "true" ]; then
              ENTRIES+=("{\"service\":\"${name}\",\"module\":\"${module}\",\"port\":\"${port}\"}")
              SERVICES+=("${name}")
            fi
          }

          check "${{ steps.filter.outputs.config-server }}"     "config-server"     "spring-petclinic-config-server"     "8888"
          check "${{ steps.filter.outputs.discovery-server }}"   "discovery-server"   "spring-petclinic-discovery-server"   "8761"
          check "${{ steps.filter.outputs.api-gateway }}"        "api-gateway"        "spring-petclinic-api-gateway"        "8080"
          check "${{ steps.filter.outputs.customers-service }}"  "customers-service"  "spring-petclinic-customers-service"  "8081"
          check "${{ steps.filter.outputs.visits-service }}"     "visits-service"     "spring-petclinic-visits-service"     "8082"
          check "${{ steps.filter.outputs.vets-service }}"       "vets-service"       "spring-petclinic-vets-service"       "8083"
          check "${{ steps.filter.outputs.genai-service }}"      "genai-service"      "spring-petclinic-genai-service"      "8084"
          check "${{ steps.filter.outputs.admin-server }}"       "admin-server"       "spring-petclinic-admin-server"       "9090"

          if [ ${#ENTRIES[@]} -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "services=" >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(printf '%s,' "${ENTRIES[@]}")
            MATRIX="[${MATRIX%,}]"
            SVCLIST="${SERVICES[*]}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
            echo "services=${SVCLIST}" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed services: ${SERVICES[*]:-none}"

  # ─── 2. Build all Maven JARs (once, shared via artifact) ───
  build-jars:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: ./mvnw clean package -DskipTests -B

      - name: Upload service JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: spring-petclinic-*/target/spring-petclinic-*.jar
          retention-days: 1

  # ─── 3. Build, scan, and push each changed service image ───
  build-push-images:
    needs: [detect-changes, build-jars]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image variables
        id: vars
        run: |
          SHA="${GITHUB_SHA::7}"
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE="${REGISTRY}/petclinic-${ECR_ENV}/${{ matrix.service }}:${SHA}"

          JAR=$(ls ${{ matrix.module }}/target/${{ matrix.module }}-*.jar 2>/dev/null | grep -v original | head -1)
          ARTIFACT_NAME=$(basename "$JAR" .jar)

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.service }} → ${IMAGE}"

      - name: Build ARM64 image (OCI tarball for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}/target
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/image.tar
          tags: ${{ steps.vars.outputs.image }}
          build-args: |
            ARTIFACT_NAME=${{ steps.vars.outputs.artifact_name }}
            EXPOSED_PORT=${{ matrix.port }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: /tmp/image.tar
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          format: "json"
          output: trivy-report.json

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-report.json
          retention-days: 30

      - name: Check HIGH vulnerabilities (warn)
        run: |
          HIGHS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-report.json)
          if [ "$HIGHS" -gt 0 ]; then
            echo "::warning::Found ${HIGHS} HIGH severity vulnerabilities in ${{ matrix.service }}. Review trivy-report artifact."
          fi

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: /tmp/image.tar
          exit-code: "1"
          severity: "CRITICAL"
          format: "table"

      - name: Push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}/target
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.image }}
          build-args: |
            ARTIFACT_NAME=${{ steps.vars.outputs.artifact_name }}
            EXPOSED_PORT=${{ matrix.port }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # ─── 4. Notify platform repo to update image tags ───
  notify-platform:
    needs: [detect-changes, build-push-images]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Trigger update-image-tags in platform repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          repository: ${{ github.repository_owner }}/petclinic-platform
          event-type: app-image-built
          client-payload: '{"sha": "${{ steps.sha.outputs.short }}", "services": "${{ needs.detect-changes.outputs.services }}"}'
